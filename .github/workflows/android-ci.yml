name: Native Android CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: bash scripts/ci-gradle.sh unit testDebugUnitTest
      - name: Assemble debug APK
        run: bash scripts/ci-gradle.sh debug assembleDebug
      - name: Verify APK exists and calculate SHA-256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: padnakasht-native-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Run Compose/Espresso UI smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 18
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: bash scripts/ci-emulator.sh
      - name: Report instrumented test failures as annotations
        if: always()
        run: python3 scripts/ci_report.py
      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padnakasht-emulator-diagnostics
          path: screenshots/*
          if-no-files-found: warn
          retention-days: 14
      # A release is published only when a newly rotated signing key is configured in GitHub Actions secrets.
      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_PATH: app/release-upload.jks
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          bash scripts/ci-gradle.sh release assembleRelease
      - name: Verify release APK signature, package and version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee release-verify.txt
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:" | tee -a release-verify.txt
          cp "$APK" padnakesht-release.apk
          sha256sum padnakesht-release.apk | tee padnakesht-release.apk.sha256
      - name: Publish GitHub Release with the verified APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VER}-build${{ github.run_number }}"
          gh release create "$TAG" padnakesht-release.apk padnakesht-release.apk.sha256 \
            --title "PadnaKesht ${VER} (build ${{ github.run_number }})" \
            --notes "Signed release APK built after unit tests and emulator tests passed. SHA-256 is attached. Release signing uses externally stored, rotated credentials." \
            --target "$GITHUB_SHA" --prerelease
      - name: Explain release publication was skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_CONFIGURED != 'true'
        run: |
          echo "::warning::Release APK publication skipped because rotated signing secrets are not configured."
          echo "Unit tests, debug build, and emulator tests still run. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD in repository Actions secrets after rotating the compromised key."
